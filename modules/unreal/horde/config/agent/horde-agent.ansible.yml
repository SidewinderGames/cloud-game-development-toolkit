---
# This playbook installs the Unreal Engine Horde Agent
- name: Linux Horde Agent
  hosts: all
  vars:
    horde_user_name: Horde
    horde_agent_dir: /home/Horde
    # Block device the AwsAsgWithDataVolumes fleet strategy attaches the
    # per-pool data volume as. Matches AwsDataVolumeSettings.DeviceName.
    horde_data_device: xvdf
    horde_data_mount: /workspace
  tasks:
    # When the pool uses the AwsAsgWithDataVolumes fleet strategy, the ASG
    # launching lifecycle hook attaches an EBS volume before this playbook
    # runs. Wait for the device, format it if blank, mount it. Idempotent so
    # the same volume can be reattached on the next launch and we just mount.
    # When no data volume is attached (legacy plain-ASG pool), the wait step
    # is skipped gracefully and the agent runs from $HOME.
    - name: Probe for data volume device
      ansible.builtin.stat:
        path: "/dev/{{ horde_data_device }}"
      register: horde_data_device_stat
    - name: Wait for data volume device to appear
      ansible.builtin.wait_for:
        path: "/dev/{{ horde_data_device }}"
        state: present
        timeout: 300
      when: horde_data_device_stat.stat.exists or lookup('env', 'HORDE_REQUIRE_DATA_VOLUME') == 'true'
      ignore_errors: true
    - name: Format data volume if blank
      community.general.filesystem:
        fstype: ext4
        dev: "/dev/{{ horde_data_device }}"
        opts: -L horde-data
      when: horde_data_device_stat.stat.exists
      register: horde_data_format_result
      failed_when: false
    - name: Mount data volume
      ansible.posix.mount:
        path: "{{ horde_data_mount }}"
        src: "/dev/{{ horde_data_device }}"
        fstype: ext4
        state: mounted
      when: horde_data_device_stat.stat.exists
    - name: Set workspace ownership on data volume
      ansible.builtin.file:
        path: "{{ horde_data_mount }}"
        owner: "{{ horde_user_name }}"
        group: "{{ horde_user_name }}"
        state: directory
        mode: "0755"
      when: horde_data_device_stat.stat.exists
    - name: Create Horde user
      ansible.builtin.user:
        name: "{{ horde_user_name }}"
        create_home: true
    - name: Add DotNet Backport package repository on Ubuntu
      ansible.builtin.apt_repository:
        repo: ppa:dotnet/backports
        state: present
      when: ansible_distribution == "Ubuntu"
    - name: Install DotNet
      ansible.builtin.package:
        name: dotnet-runtime-{{ dotnet_runtime_version }}
        state: present
    - name: Check if i386 enabled
      ansible.builtin.shell:
        cmd: set -o pipefail && dpkg --print-foreign-architectures | grep i386
        executable: /bin/bash
      register: result_i386_check
      changed_when: result_i386_check.rc == 1
      failed_when: result_i386_check.rc > 1
    - name: Enable Multiarch
      ansible.builtin.command:
        cmd: dpkg --add-architecture i386
      when: result_i386_check.rc == 1
      changed_when: result_i386_check.rc == 1
    - name: Update Cache
      ansible.builtin.apt:
        update_cache: true
      when: result_i386_check.rc == 1
    - name: Install Wine on Ubuntu machines
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      with_items: [wine, wine32:i386]
      when: ansible_distribution == "Ubuntu"
    - name: Download the Horde Agent
      ansible.builtin.uri:
        url: https://{{ horde_server_url }}/api/v1/tools/horde-agent?action=Zip
        dest: "{{ horde_agent_dir }}/agent.zip"
    - name: Unarchive The Horde Agent
      ansible.builtin.unarchive:
        src: "{{ horde_agent_dir }}/agent.zip"
        dest: "{{ horde_agent_dir }}"
        owner: "{{ horde_user_name }}"
      become: true
      become_user: "{{ horde_user_name }}"
    - name: Load appsettings.json
      ansible.builtin.slurp:
        src: "{{ horde_agent_dir }}/appsettings.json"
      register: appsettings
      become: true
      become_user: "{{ horde_user_name }}"
    - name: Debug imported appsettings.json
      ansible.builtin.debug:
        msg: "{{ appsettings.content | b64decode | from_json }}"
    - name: Modify appsettings.json to include Wine executable
      ansible.builtin.set_fact:
        appsettings: "{{ appsettings.content | b64decode | from_json | combine(item, recursive=True) }}"
      loop:
        - Horde:
            EnableAwsEc2Support: true
            wineExecutablePath: /usr/bin/wine
    - name: Debug updated appsettings.json
      ansible.builtin.debug:
        var: appsettings
    - name: Write updated appsettings.json to file
      ansible.builtin.copy:
        content: "{{ appsettings | to_nice_json }}"
        dest: /home/Horde/appsettings.json
        mode: "0644"
      become: true
      become_user: "{{ horde_user_name }}"
    - name: Configure the Horde Agent
      ansible.builtin.shell:
        chdir: $HORDE_AGENT_DIR
        cmd: dotnet HordeAgent.dll SetServer -Name="Default" -Url="$HORDE_SERVER_URL" -Default
      become: true
      become_user: "{{ horde_user_name }}"
      environment:
        HORDE_AGENT_DIR: "{{ horde_agent_dir }}"
        HORDE_SERVER_URL: https://{{ horde_server_url }}
      changed_when: true
    - name: Create Horde Agent Service
      ansible.builtin.copy:
        src: horde-agent.service
        dest: /etc/systemd/system/horde-agent.service
        mode: "0644"
    - name: Enable Horde Agent Service
      ansible.builtin.service:
        service: horde-agent
        enabled: true
        state: started
